version: '3.8'

services:

  frontend:
    build: 
      context: ./frontend/angular-engdss
      dockerfile: ../Dockerfile.frontend
    container_name: angular-app
    ports:
      - "4200:4200"
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  mysql:
    build: ./docker/mysql
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: