version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend/angular-engdss
      dockerfile: ../Dockerfile.frontend
    container_name: angular-app
    ports:
      - "4200:4200"
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"