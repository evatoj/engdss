services:

  # ── Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/angular-engdss
      dockerfile: ../Dockerfile.frontend
    container_name: angular-app
    ports:
      - "4200:4200"
    depends_on:
      - transaction-service
    networks:
      - observability-net

 # ── Transaction Service ───────────────────────────────
  transaction-service:
    build:
      context: ./backend/transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pagamento?currentSchema=transaction
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      OTEL_SERVICE_NAME: transaction-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.name=transaction-service,deployment.environment=dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - observability-net

  # ── Ledger Service ────────────────────────────────────
  ledger-service:
    build:
      context: ./backend/ledger-service
      dockerfile: Dockerfile
    container_name: ledger-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pagamento?currentSchema=ledger
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      LEDGER_QUEUE_SAQUE_INICIADO: ledger.saque.iniciado
      LEDGER_QUEUE_PIX_CONFIRMADO: ledger.pix.confirmado
      LEDGER_QUEUE_PIX_FALHOU: ledger.pix.falhou
      OTEL_SERVICE_NAME: ledger-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.name=ledger-service,deployment.environment=dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - observability-net
  # ── Biometric Adapter Service ─────────────────────────
  biometric-adapter-service:
    build:
      context: ./backend/biometric-adapter-service
      dockerfile: Dockerfile
    container_name: biometric-adapter-service
    ports:
      - "8083:8083"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      VALIDRA_BASE_URL: https://api.validra.com.br
      VALIDRA_API_KEY: ${VALIDRA_API_KEY:-STUB_KEY}
      SERVER_PORT: 8083
      OTEL_SERVICE_NAME: biometric-adapter-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.name=biometric-adapter-service,deployment.environment=dev
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - observability-net


  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pagamento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgresql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pagamento"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability-net

  # ── RabbitMQ ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI → http://localhost:15672
      - "15692:15692"  # Prometheus metrics
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: >
      sh -c "
        rabbitmq-plugins enable --offline rabbitmq_prometheus &&
        rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  observability-net:
    name: observability-net
    driver: bridge