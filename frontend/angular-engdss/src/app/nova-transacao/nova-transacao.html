<p-toast></p-toast>
<div class="flex justify-content-center h-screen align-items-center">
  <p-panel class="text-center surface-200">
    <ng-template pTemplate="header">
      <div class="justify-content-center w-full">
        <h1 class="w-full">ENVIAR PIX</h1>
      </div>
    </ng-template>
    <p-floatlabel variant="in" class="w-full">
      <input id="chave" type="text" pInputText [(ngModel)]="form.chave" class="w-full mb-2" />
      <label for="chave" class="pl-2">Chave PIX</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="w-full">
      <p-inputnumber
        inputId="valor"
        [(ngModel)]="form.valor"
        class="w-full mb-2"
        mode="currency"
        currency="BRL"
      />
      <label for="valor" class="pl-2">Valor</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="w-full">
      <input
        id="descricao"
        type="text"
        pInputText
        [(ngModel)]="form.descricao"
        class="w-full mb-2"
      />
      <label for="descricao" class="pl-2">Descrição</label>
    </p-floatlabel>
    <button pButton label="Enviar" class="w-full mt-2" (click)="enviar_transacao()"></button>
  </p-panel>
</div>
