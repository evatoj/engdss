<p-card header="Consultar transação por ID">
  <div class="grid">
    <div class="col-12 md:col-9">
      <input
        pInputText
        type="text"
        [(ngModel)]="transacaoId"
        placeholder="Informe o ID da transação"
        class="w-full"
      />
    </div>

    <div class="col-12 md:col-3">
      <button
        pButton
        type="button"
        label="Consultar"
        class="w-full"
        (click)="consultar()"
      ></button>
    </div>
  </div>

  <div class="mt-4" *ngIf="transacao">
    <p><strong>ID:</strong> {{ transacao.id }}</p>
    <p><strong>Usuário:</strong> {{ transacao.usuarioId }}</p>
    <p><strong>Destino PIX:</strong> {{ transacao.chavePixDestino }}</p>
    <p><strong>Valor:</strong> {{ transacao.valor | currency:'BRL' }}</p>
    <p><strong>Status:</strong> {{ transacao.status }}</p>
    <p><strong>Descrição:</strong> {{ transacao.descricao }}</p>
    <p><strong>Data:</strong> {{ transacao.dataCriacao }}</p>
  </div>
</p-card>
