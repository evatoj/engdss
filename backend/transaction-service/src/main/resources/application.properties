spring.application.name=transaction-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/pagamento?currentSchema=transaction
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=transaction
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Porta
server.port=8080

# Integração com ledger
ledger.base-url=http://ledger-service:8082

# Exchange
app.rabbit.exchange=ledger.exchange

# Routing keys publicadas pelo transaction-service
app.rabbit.routing-key.credito-inicial=ledger.credito.inicial
app.rabbit.routing-key.saque-iniciado=ledger.saque.iniciado

# Routing keys consumidas do ledger
app.rabbit.routing-key.ledger-debited=ledger.debited
app.rabbit.routing-key.ledger-debit-confirmed=ledger.debit.confirmed
app.rabbit.routing-key.ledger-reversed=ledger.reversed
app.rabbit.routing-key.ledger-debit-denied=ledger.debit.denied

# Filas consumidas pelo transaction-service
app.rabbit.queue.ledger-debited=transaction.ledger.debited
app.rabbit.queue.ledger-debit-confirmed=transaction.ledger.debit.confirmed
app.rabbit.queue.ledger-reversed=transaction.ledger.reversed
app.rabbit.queue.ledger-debit-denied=transaction.ledger.debit.denied

# Asaas Sandbox
asaas.enabled=${ASAAS_ENABLED:false}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com}
asaas.api-key=${ASAAS_API_KEY:}
asaas.webhook.auth-token=${ASAAS_WEBHOOK_AUTH_TOKEN:}

# Routing keys publicadas pelo transaction-service para o ledger
app.rabbit.routing-key.pix-confirmado=ledger.pix.confirmado
app.rabbit.routing-key.pix-falhou=ledger.pix.falhou

pix.provider=${PIX_PROVIDER:mock}

pix.mock.status=${PIX_MOCK_STATUS:DONE}
pix.mock.fail-reason=${PIX_MOCK_FAIL_REASON:Falha simulada do provedor PIX}
pix.mock.delay-ms=${PIX_MOCK_DELAY_MS:10000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces