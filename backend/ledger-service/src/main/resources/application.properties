spring.application.name=ledger-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/pagamento?currentSchema=ledger
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=ledger
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Porta
server.port=8082

# Filas
ledger.queue.saque-iniciado=ledger.saque.iniciado
ledger.queue.pix-confirmado=ledger.pix.confirmado
ledger.queue.pix-falhou=ledger.pix.falhou
ledger.queue.credito-inicial=ledger.credito.inicial

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces